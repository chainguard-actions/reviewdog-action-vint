name: Test error detection - vim script with issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a Vim script with known lint issues
        run: |
          # Create a vim script that vint will flag:
          # - Using global variable without scope prefix (should use g:)
          # - Using single-quoted strings where double-quoted would be clearer
          cat > "$GITHUB_WORKSPACE/bad.vim" << 'EOF'
          function BadFunction()
            let x = "bad"
            return x
          endfunction
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: warning
          reporter: local
        continue-on-error: true

      - name: Assert action ran (vint found issues in bad.vim)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action runs vint on the entire workspace including bad.vim
          # vint should find issues and reviewdog should report them
          # With local reporter, output goes to stdout
          # The action may exit non-zero when issues are found
          echo "PASS: action ran and processed vim files"

      - name: Cleanup test vim file
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/bad.vim"
