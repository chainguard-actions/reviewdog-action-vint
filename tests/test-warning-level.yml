name: Test warning level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run vint action with warning level
        id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: warning
          reporter: github-check
        continue-on-error: true

      - name: Assert action completed with warning level
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          # The action runs vint on the workspace and reports via reviewdog at warning level.
          # It may find issues in testdata/*.vim files (which is expected behavior).
          # We just verify the action ran (not that it found zero issues).
          echo "PASS: action ran with level=warning"
