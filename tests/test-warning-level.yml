name: Test vint with warning level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run vint action with warning level (local reporter)
        id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: 'warning'
          reporter: 'local'

      - name: Assert action completed with warning level
        run: |
          echo "PASS: vint action ran successfully with warning level and local reporter"
