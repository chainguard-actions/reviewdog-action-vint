name: Test vint with warning level on script with issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a Vim script with potential style issues for vint
        run: |
          cat > "$GITHUB_WORKSPACE/problematic.vim" << 'EOF'
          " Vim script with style issues that vint may flag
          function! BadFunction()
            let x = "unused variable"
            echo "done"
          endfunction
          EOF

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run vint action with warning level
        id: vint
        uses: .
        with:
          github_token: ${{ github.token }}
          level: warning
          reporter: github-pr-check
        continue-on-error: true

      - name: Assert action ran with warning level
        run: |
          echo "vint action step outcome: ${{ steps.vint.outcome }}"
          if [ "${{ steps.vint.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with warning level (outcome: ${{ steps.vint.outcome }})"
