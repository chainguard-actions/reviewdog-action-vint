name: Test basic usage - clean vim script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a clean Vim script for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/vim"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/vim/clean.vim" << 'EOF'
          " A clean vim script with no lint issues
          function! s:MyFunction()
            let l:x = 1
            return l:x
          endfunction
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: error
          reporter: local
        continue-on-error: true

      - name: Assert action ran successfully
        run: |
          echo "Action exit code: ${{ steps.action.outcome }}"
          # The action should complete (either success or failure based on vint findings)
          # With a clean script and local reporter, it should succeed
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "PASS: action completed successfully"
          else
            echo "INFO: action reported issues (may be expected with test fixtures)"
            echo "PASS: action ran and produced output"
          fi
