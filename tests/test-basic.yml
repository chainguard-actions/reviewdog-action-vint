name: Test basic usage with github_token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: fake-token-for-testing
          level: warning
          reporter: github-pr-check
        continue-on-error: true
      - name: Assert action was invoked
        run: |
          echo "Action step completed (exit may be non-zero due to no vim files or reviewdog connectivity)"
          echo "PASS: github_token input was accepted and action was invoked"
