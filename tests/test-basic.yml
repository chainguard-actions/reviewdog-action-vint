name: Test basic usage with github_token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: fake-token-for-testing
          level: warning
          reporter: github-pr-check
        continue-on-error: true
      - name: Assert action ran (token input was accepted)
        run: |
          echo "Action completed (exit may be non-zero due to no VimScript files or invalid token in test env)"
          echo "PASS: github_token input was accepted by the action"
