name: Test basic usage with github_token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run vint action with github_token
        id: action
        uses: .
        with:
          github_token: fake-token-for-local-testing
          level: error
          reporter: local
      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
