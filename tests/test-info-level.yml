name: Test info level - vint with reviewdog
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run vint action with info level and local reporter
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          level: info
          reporter: local
      - name: Assert action completed successfully with info level
        run: |
          echo "Action completed with info level without error"
          echo "PASS"
