name: Test reporter=github-pr-review configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with github-pr-review reporter
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          level: warning
          reporter: github-pr-review
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Verify action was invoked with github-pr-review reporter
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should have been invoked (not skipped)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with reporter=github-pr-review and level=warning"
