name: reviewdog
on: [pull_request]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  vint:
    name: runner / vint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: vint
        uses: ./
        with:
          github_token: ${{ secrets.github_token }}
      - name: vint-check
        uses: ./
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-check
          level: warning
      - name: vint-pr-review
        uses: ./
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
